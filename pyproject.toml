[project]
name = "milaan"
version = "0.1.0"
description = "Bank-credit to settlement exact-cover reconciliation, to the paise, with refusal instead of guessing."
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
]

[project.scripts]
milaan = "milaan.cli:main"

[project.optional-dependencies]
hints = [
    # The narration-hint layer. Optional on purpose: its measured contribution on
    # the shipped batch is +0 (INCIDENTS.md #18), so the core reconciler must not
    # depend on it. `pip install -e ".[hints]"` to exercise it against a model.
    "anthropic>=0.40",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/milaan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
